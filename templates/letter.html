<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    /* Page size/margins are supplied by PdfGenerator. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        margin: 0;
        padding: 0;
    }
    body { font-family: 'Times New Roman', serif; font-size: 12pt; color: #333; padding: 0; line-height: 1.6; }
    .page-content {
        position: relative;
        min-height: calc(var(--ppos-page-height) - var(--ppos-margin-top) - var(--ppos-margin-bottom));
        padding-bottom: 30mm;
    }
    .letterhead-img { width: 100%; max-height: 100px; margin-bottom: 30px; }
    .sender { margin-bottom: 30px; }
    .date { margin-bottom: 30px; }
    .recipient { margin-bottom: 30px; }
    .salutation { margin-bottom: 20px; }
    .body { margin-bottom: 30px; text-align: justify; }
    .closing { }
    .signature { margin-top: 50px; }
</style>
</head>
<body>
<div class="page-content">
    {{#if letterhead_image}}<img src="{{letterhead_image}}" class="letterhead">{{/if}}
    
    <div class="sender">
        <strong>{{sender_name}}</strong><br>
        {{sender_address}}
    </div>
    
    <div class="date">{{date}}</div>
    
    <div class="recipient">
        <strong>{{recipient_name}}</strong><br>
        {{recipient_address}}
    </div>
    
    <div class="salutation">Dear {{recipient_name}},</div>
    
    <div class="body">{{body}}</div>
    
    <div class="closing">Sincerely,</div>
    
    <div class="signature">
        <strong>{{sender_name}}</strong><br>
        {{sender_title}}
    </div>
</div><!-- end page-content -->
</body>
</html>
