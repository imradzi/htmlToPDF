<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal Fontconfig configuration shipped next to ppServer.exe.
  PlutoBook points FONTCONFIG_PATH here (see PdfGenerator::initLibrary).

  It scans the Windows font directory directly; no MSYS2/Cygwin paths are
  required. Keep fonts.dtd in this directory (fontconfig needs it to parse).
-->
<fontconfig>
    <dir>C:/Windows/Fonts</dir>
    <dir prefix="relative">.</dir>
    <cachedir prefix="relative">cache</cachedir>

    <alias>
        <family>sans-serif</family>
        <prefer><family>Arial</family></prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer><family>Times New Roman</family></prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer><family>Consolas</family></prefer>
    </alias>
</fontconfig>
